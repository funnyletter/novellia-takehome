[project]
name = "novellia-takehome"
version = "0.1.0"
description = "Novellia takehome assignment: API"
readme = "README.md"
authors = [
    { name = "Rachel Schirra", email = "rachel@funnyletter.net" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156.2",
    "fhir-resources>=8.3.0",
    "loguru>=0.7.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
novellia-takehome = "novellia_takehome:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
